[project]
name = "zarr-grid-h3"
version = "0.1.0"
description = "H3 traversal over a native Zarr grid: the raster is drawn, H3 is the transformation"
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.9",
    "duckdb>=1.5.5",
    "h3>=4.5.0",
    "h3ronpy>=0.22.0",
    "icechunk",
    "marimo==0.24.0",
    "matplotlib>=3.11.1",
    "numpy==2.5.1",
    "obstore>=0.9.2",
    "pyarrow>=25.0.0",
    "pyproj>=3.7",
    "scipy>=1.18.1",
    "xarray",
    "xarray-sql>=0.3.3",
    "zarr>=3",
]

[dependency-groups]
dev = ["playwright"]
